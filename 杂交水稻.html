<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稻梦工程师 - 杂交水稻模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            color: #a8d8ea;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            min-width: 120px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #FFD700;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 5px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .panel h2 {
            color: #FFD700;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid rgba(255,215,0,0.3);
            padding-bottom: 10px;
        }

        .gene-pool {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .gene-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .gene-item:hover {
            transform: translateX(5px);
            border-color: #FFD700;
            background: rgba(255,215,0,0.1);
        }

        .gene-item.selected {
            border-color: #00ff88;
            background: rgba(0,255,136,0.2);
        }

        .gene-name {
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .gene-trait {
            font-size: 0.85em;
            color: #a8d8ea;
        }

        .gene-rarity {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .rarity-common { background: #95a5a6; }
        .rarity-rare { background: #3498db; }
        .rarity-epic { background: #9b59b6; }
        .rarity-legendary { background: #e74c3c; }

        .lab-area {
            text-align: center;
        }

        .hybrid-slots {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .slot {
            width: 150px;
            height: 200px;
            background: rgba(0,0,0,0.3);
            border: 3px dashed rgba(255,255,255,0.3);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .slot.filled {
            border-style: solid;
            border-color: #FFD700;
            background: rgba(255,215,0,0.1);
        }

        .slot-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .slot-name {
            font-size: 0.9em;
            color: #a8d8ea;
        }

        .hybrid-btn {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #1e3c72;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
            margin: 20px 0;
        }

        .hybrid-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255,215,0,0.6);
        }

        .hybrid-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .field-plot {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .field-plot:hover {
            transform: scale(1.05);
            border-color: #FFD700;
        }

        .field-plot.planted {
            background: linear-gradient(135deg, #228B22 0%, #32CD32 100%);
        }

        .field-plot.mature {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255,215,0,0.5); }
            50% { box-shadow: 0 0 20px rgba(255,215,0,0.8); }
        }

        .rice-icon {
            font-size: 2em;
            transition: all 0.3s;
        }

        .field-plot.mature .rice-icon {
            font-size: 2.5em;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .plot-info {
            font-size: 0.7em;
            margin-top: 5px;
            text-align: center;
        }

        .world-map {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .regions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .region {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #e74c3c;
            transition: all 0.3s;
        }

        .region.solved {
            border-left-color: #00ff88;
            background: rgba(0,255,136,0.1);
        }

        .region h3 {
            color: #FFD700;
            margin-bottom: 10px;
        }

        .crisis-level {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .crisis-high { background: #e74c3c; }
        .crisis-medium { background: #f39c12; }
        .crisis-low { background: #27ae60; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #FFD700;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5em;
            cursor: pointer;
            color: #fff;
            opacity: 0.7;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .rice-card {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            border: 2px solid rgba(255,215,0,0.3);
        }

        .trait-bar {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .trait-name {
            width: 100px;
            font-size: 0.9em;
        }

        .trait-progress {
            flex: 1;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 10px;
        }

        .trait-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            transition: width 0.5s;
            border-radius: 10px;
        }

        .trait-value {
            width: 40px;
            text-align: right;
            font-weight: bold;
            color: #FFD700;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            border-left: 4px solid #FFD700;
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 2000;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .achievement {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1e3c72;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .achievement-icon {
            font-size: 2em;
        }

        .tech-tree {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tech-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .tech-item.unlocked {
            border-color: #00ff88;
            background: rgba(0,255,136,0.1);
        }

        .tech-item:hover:not(.unlocked) {
            border-color: #FFD700;
            cursor: pointer;
        }

        .tech-cost {
            color: #FFD700;
            font-weight: bold;
        }

        .progress-ring {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 8;
        }

        .progress-ring .bg {
            stroke: rgba(255,255,255,0.1);
        }

        .progress-ring .progress {
            stroke: #FFD700;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.5s;
        }

        .year-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2em;
            font-weight: bold;
            color: #FFD700;
        }

        .dna-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            opacity: 0;
            pointer-events: none;
        }

        .dna-animation.active {
            animation: dnaMerge 1.5s;
        }

        @keyframes dnaMerge {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(0deg); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(180deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1) rotate(360deg); }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🌾 稻梦工程师</h1>
            <p class="subtitle">成为世界的工程师，用科学解决饥饿问题</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="researchPoints">0</div>
                <div class="stat-label">研究点数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="riceVarieties">0</div>
                <div class="stat-label">培育品种</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="savedPopulation">0</div>
                <div class="stat-label">拯救人口(万)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="globalCoverage">0%</div>
                <div class="stat-label">全球覆盖率</div>
            </div>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2>🧬 基因库</h2>
                <div class="gene-pool" id="genePool">
                    <!-- 动态生成基因 -->
                </div>
            </div>

            <div class="panel lab-area">
                <h2>⚗️ 杂交实验室</h2>
                <p style="margin-bottom: 20px; opacity: 0.8;">选择两个亲本进行杂交育种</p>
                
                <div class="hybrid-slots">
                    <div class="slot" id="slot1" onclick="selectSlot(1)">
                        <div class="slot-icon">🌱</div>
                        <div class="slot-name">亲本 A</div>
                    </div>
                    <div style="font-size: 2em; align-self: center;">⚡</div>
                    <div class="slot" id="slot2" onclick="selectSlot(2)">
                        <div class="slot-icon">🌱</div>
                        <div class="slot-name">亲本 B</div>
                    </div>
                </div>

                <button class="hybrid-btn" id="hybridBtn" onclick="performHybridization()" disabled>
                    开始杂交实验
                </button>

                <div class="dna-animation" id="dnaAnim">🧬</div>

                <div class="tech-tree" style="margin-top: 30px;">
                    <h3 style="color: #FFD700; margin-bottom: 15px;">🔬 科技树</h3>
                    <div class="tech-item unlocked" id="tech1">
                        <div>
                            <div style="font-weight: bold;">基础杂交</div>
                            <div style="font-size: 0.8em; opacity: 0.7;">解锁基础育种技术</div>
                        </div>
                        <div class="tech-cost">已解锁</div>
                    </div>
                    <div class="tech-item" id="tech2" onclick="unlockTech('geneEditing', 500)">
                        <div>
                            <div style="font-weight: bold;">基因编辑</div>
                            <div style="font-size: 0.8em; opacity: 0.7;">精确修改特定性状</div>
                        </div>
                        <div class="tech-cost">500 RP</div>
                    </div>
                    <div class="tech-item" id="tech3" onclick="unlockTech('spaceBreeding', 1500)">
                        <div>
                            <div style="font-weight: bold;">太空育种</div>
                            <div style="font-size: 0.8em; opacity: 0.7;">利用宇宙射线诱变</div>
                        </div>
                        <div class="tech-cost">1500 RP</div>
                    </div>
                    <div class="tech-item" id="tech4" onclick="unlockTech('superRice', 5000)">
                        <div>
                            <div style="font-weight: bold;">超级稻计划</div>
                            <div style="font-size: 0.8em; opacity: 0.7;">培育超级杂交稻</div>
                        </div>
                        <div class="tech-cost">5000 RP</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>🌾 试验田</h2>
                <div class="field-grid" id="fieldGrid">
                    <!-- 动态生成田地 -->
                </div>
                
                <div style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 10px;">
                    <div style="font-size: 0.9em; margin-bottom: 10px;">📊 当前种植状态</div>
                    <div id="fieldStatus">空闲田地: 12/12</div>
                </div>
            </div>
        </div>

        <div class="world-map">
            <h2>🌍 全球粮食危机地图</h2>
            <p style="margin: 10px 0; opacity: 0.8;">将你的优良品种推广到世界各地，解决区域粮食危机</p>
            <div class="regions" id="regions">
                <!-- 动态生成区域 -->
            </div>
        </div>
    </div>

    <div class="modal" id="riceModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">新品种详情</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <svg class="progress-ring" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="40"></circle>
        <circle class="progress" id="yearProgress" cx="50" cy="50" r="40" 
                stroke-dasharray="251.2" stroke-dashoffset="0"></circle>
        <text class="year-display" id="yearDisplay">1970</text>
    </svg>

    <script>
        // 游戏状态
        const gameState = {
            year: 1970,
            researchPoints: 0,
            varieties: [],
            savedPopulation: 0,
            selectedGenes: [null, null],
            unlockedTechs: ['basic'],
            fieldPlots: Array(12).fill(null),
            regions: [
                { name: '撒哈拉以南非洲', crisis: 95, solved: false, requirement: { yield: 80, drought: 90 } },
                { name: '南亚次大陆', crisis: 85, solved: false, requirement: { yield: 85, pest: 70 } },
                { name: '东南亚群岛', crisis: 70, solved: false, requirement: { yield: 75, disease: 80 } },
                { name: '中美洲', crisis: 60, solved: false, requirement: { yield: 70, climate: 75 } },
                { name: '中亚干旱区', crisis: 75, solved: false, requirement: { yield: 65, drought: 95, salt: 80 } }
            ],
            genePool: [
                { id: 1, name: '野生稻A', traits: { yield: 30, drought: 80, disease: 40, pest: 50, quality: 20 }, rarity: 'common' },
                { id: 2, name: '籼稻良种', traits: { yield: 60, drought: 50, disease: 60, pest: 55, quality: 70 }, rarity: 'common' },
                { id: 3, name: '粳稻精品', traits: { yield: 55, drought: 45, disease: 65, pest: 60, quality: 85 }, rarity: 'common' },
                { id: 4, name: '非洲长穗稻', traits: { yield: 40, drought: 90, disease: 30, pest: 40, quality: 30 }, rarity: 'rare' },
                { id: 5, name: '深水稻', traits: { yield: 45, drought: 20, disease: 50, pest: 45, quality: 40, flood: 95 }, rarity: 'rare' },
                { id: 6, name: '香稻突变体', traits: { yield: 35, drought: 40, disease: 45, pest: 50, quality: 95, aroma: 90 }, rarity: 'epic' },
                { id: 7, name: '盐碱稻', traits: { yield: 50, drought: 70, disease: 55, pest: 50, quality: 50, salt: 90 }, rarity: 'rare' },
                { id: 8, name: '竹稻杂交种', traits: { yield: 70, drought: 60, disease: 80, pest: 85, quality: 60, height: 150 }, rarity: 'epic' }
            ]
        };

        // 初始化游戏
        function init() {
            renderGenePool();
            renderField();
            renderRegions();
            updateStats();
            startTimeProgression();
        }

        // 渲染基因库
        function renderGenePool() {
            const pool = document.getElementById('genePool');
            pool.innerHTML = gameState.genePool.map(gene => `
                <div class="gene-item ${gameState.selectedGenes.includes(gene.id) ? 'selected' : ''}" 
                     onclick="selectGene(${gene.id})" data-id="${gene.id}">
                    <span class="gene-rarity rarity-${gene.rarity}">${getRarityText(gene.rarity)}</span>
                    <div class="gene-name">${gene.name}</div>
                    <div class="gene-trait">
                        产量:${gene.traits.yield} | 抗旱:${gene.traits.drought} | 品质:${gene.traits.quality}
                        ${gene.traits.flood ? '| 耐涝:' + gene.traits.flood : ''}
                        ${gene.traits.salt ? '| 耐盐:' + gene.traits.salt : ''}
                    </div>
                </div>
            `).join('');
        }

        function getRarityText(rarity) {
            const map = { common: '普通', rare: '稀有', epic: '史诗', legendary: '传说' };
            return map[rarity] || rarity;
        }

        // 选择基因
        function selectGene(geneId) {
            const index = gameState.selectedGenes.indexOf(geneId);
            if (index > -1) {
                gameState.selectedGenes[index] = null;
            } else {
                if (!gameState.selectedGenes[0]) {
                    gameState.selectedGenes[0] = geneId;
                } else if (!gameState.selectedGenes[1]) {
                    gameState.selectedGenes[1] = geneId;
                } else {
                    showNotification('已经选择了两个亲本！', 'warning');
                    return;
                }
            }
            updateSlots();
            renderGenePool();
        }

        // 更新槽位显示
        function updateSlots() {
            const slots = [1, 2];
            slots.forEach((num, idx) => {
                const slot = document.getElementById(`slot${num}`);
                const geneId = gameState.selectedGenes[idx];
                if (geneId) {
                    const gene = gameState.genePool.find(g => g.id === geneId);
                    slot.classList.add('filled');
                    slot.innerHTML = `
                        <div class="slot-icon">🌾</div>
                        <div class="slot-name">${gene.name}</div>
                        <div style="font-size: 0.8em; color: #FFD700;">产量:${gene.traits.yield}</div>
                    `;
                } else {
                    slot.classList.remove('filled');
                    slot.innerHTML = `
                        <div class="slot-icon">🌱</div>
                        <div class="slot-name">亲本 ${String.fromCharCode(64 + num)}</div>
                    `;
                }
            });
            
            document.getElementById('hybridBtn').disabled = 
                !(gameState.selectedGenes[0] && gameState.selectedGenes[1]);
        }

        // 执行杂交
        function performHybridization() {
            const gene1 = gameState.genePool.find(g => g.id === gameState.selectedGenes[0]);
            const gene2 = gameState.genePool.find(g => g.id === gameState.selectedGenes[1]);
            
            // DNA动画
            document.getElementById('dnaAnim').classList.add('active');
            setTimeout(() => document.getElementById('dnaAnim').classList.remove('active'), 1500);
            
            // 计算后代性状（孟德尔遗传 + 突变）
            const childTraits = {};
            const allTraits = new Set([...Object.keys(gene1.traits), ...Object.keys(gene2.traits)]);
            
            allTraits.forEach(trait => {
                const t1 = gene1.traits[trait] || 0;
                const t2 = gene2.traits[trait] || 0;
                // 杂种优势：平均值 + 随机优势加成
                const base = Math.floor((t1 + t2) / 2);
                const heterosis = Math.random() > 0.7 ? Math.floor(Math.random() * 15) : 0;
                const mutation = Math.random() > 0.95 ? Math.floor(Math.random() * 20) : 0;
                childTraits[trait] = Math.min(100, base + heterosis + mutation);
            });
            
            // 生成新品种
            const newVariety = {
                id: Date.now(),
                name: generateVarietyName(gene1, gene2),
                parents: [gene1.name, gene2.name],
                traits: childTraits,
                created: gameState.year,
                generation: calculateGeneration(gene1, gene2)
            };
            
            gameState.varieties.push(newVariety);
            gameState.researchPoints += Math.floor(childTraits.yield / 2);
            
            // 清空选择
            gameState.selectedGenes = [null, null];
            updateSlots();
            renderGenePool();
            updateStats();
            
            // 显示结果
            showVarietyModal(newVariety);
            showNotification(`成功培育新品种：${newVariety.name}！`, 'success');
            
            // 检查解锁
            checkUnlocks();
        }

        function generateVarietyName(g1, g2) {
            const prefixes = ['超级', '黄金', '翡翠', '珍珠', '巨龙', '凤凰', '星辰', '大地'];
            const suffixes = ['1号', '优系', '杂交种', '改良版', '新组合', '实验株'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            return prefix + (g1.name.charAt(0) + g2.name.charAt(g2.name.length-1)) + suffix;
        }

        function calculateGeneration(g1, g2) {
            const gen1 = g1.generation || 1;
            const gen2 = g2.generation || 1;
            return Math.max(gen1, gen2) + 1;
        }

        // 渲染试验田
        function renderField() {
            const grid = document.getElementById('fieldGrid');
            grid.innerHTML = gameState.fieldPlots.map((plot, idx) => {
                if (!plot) {
                    return `<div class="field-plot" onclick="plantRice(${idx})">
                        <div class="rice-icon">🟫</div>
                        <div class="plot-info">空闲</div>
                    </div>`;
                }
                const isMature = plot.mature;
                return `<div class="field-plot ${isMature ? 'mature' : 'planted'}" onclick="harvestRice(${idx})">
                    <div class="rice-icon">${isMature ? '🌾' : '🌱'}</div>
                    <div class="plot-info">${plot.variety.name.substring(0,4)}<br>${isMature ? '可收获' : '生长中'}</div>
                </div>`;
            }).join('');
            
            const used = gameState.fieldPlots.filter(p => p).length;
            document.getElementById('fieldStatus').textContent = `空闲田地: ${12 - used}/12 | 种植中: ${used}`;
        }

        // 种植水稻
        function plantRice(idx) {
            if (gameState.varieties.length === 0) {
                showNotification('请先培育品种！', 'warning');
                return;
            }
            
            // 简单选择最近培育的品种
            const variety = gameState.varieties[gameState.varieties.length - 1];
            gameState.fieldPlots[idx] = {
                variety: variety,
                planted: gameState.year,
                mature: false
            };
            
            // 模拟生长时间
            setTimeout(() => {
                if (gameState.fieldPlots[idx]) {
                    gameState.fieldPlots[idx].mature = true;
                    renderField();
                    showNotification(`${variety.name} 已成熟！`, 'success');
                }
            }, 5000);
            
            renderField();
            showNotification(`种植了 ${variety.name}`, 'info');
        }

        // 收获水稻
        function harvestRice(idx) {
            const plot = gameState.fieldPlots[idx];
            if (!plot.mature) {
                showNotification('还未成熟！', 'warning');
                return;
            }
            
            const yield = plot.variety.traits.yield;
            gameState.researchPoints += yield;
            gameState.savedPopulation += Math.floor(yield / 10);
            
            // 粒子效果
            createParticles(event.clientX, event.clientY);
            
            gameState.fieldPlots[idx] = null;
            renderField();
            updateStats();
            showNotification(`收获成功！获得 ${yield} 研究点数`, 'success');
            
            checkRegionalSolutions(plot.variety);
        }

        // 检查区域解决方案
        function checkRegionalSolutions(variety) {
            gameState.regions.forEach(region => {
                if (region.solved) return;
                
                let meets = true;
                for (let [trait, value] of Object.entries(region.requirement)) {
                    if ((variety.traits[trait] || 0) < value) {
                        meets = false;
                        break;
                    }
                }
                
                if (meets) {
                    region.solved = true;
                    region.crisis = 10;
                    gameState.savedPopulation += 500;
                    showNotification(`🎉 成功解决 ${region.name} 的粮食危机！`, 'success');
                    renderRegions();
                    updateStats();
                }
            });
        }

        // 渲染区域
        function renderRegions() {
            const container = document.getElementById('regions');
            container.innerHTML = gameState.regions.map(region => `
                <div class="region ${region.solved ? 'solved' : ''}">
                    <h3>${region.solved ? '✅' : '⚠️'} ${region.name}</h3>
                    <div style="font-size: 0.9em; margin: 10px 0;">
                        危机等级: <span class="crisis-level crisis-${region.crisis > 80 ? 'high' : region.crisis > 50 ? 'medium' : 'low'}">${region.crisis}%</span>
                    </div>
                    <div style="font-size: 0.8em; opacity: 0.8;">
                        ${region.solved ? '已解决粮食危机' : `需求: ${Object.entries(region.requirement).map(([k,v]) => `${k}:${v}`).join(', ')}`}
                    </div>
                    ${!region.solved ? `<button onclick="deployVariety('${region.name}')" style="margin-top: 10px; padding: 5px 15px; background: #FFD700; color: #1e3c72; border: none; border-radius: 5px; cursor: pointer;">部署品种</button>` : ''}
                </div>
            `).join('');
        }

        function deployVariety(regionName) {
            if (gameState.varieties.length === 0) {
                showNotification('没有可部署的品种！', 'warning');
                return;
            }
            showNotification('请选择试验田中成熟的作物进行部署', 'info');
        }

        // 解锁科技
        function unlockTech(tech, cost) {
            if (gameState.unlockedTechs.includes(tech)) return;
            if (gameState.researchPoints < cost) {
                showNotification('研究点数不足！', 'warning');
                return;
            }
            
            gameState.researchPoints -= cost;
            gameState.unlockedTechs.push(tech);
            document.getElementById(`tech${tech === 'geneEditing' ? 2 : tech === 'spaceBreeding' ? 3 : 4}`).classList.add('unlocked');
            updateStats();
            showNotification(`解锁成功：${tech === 'geneEditing' ? '基因编辑' : tech === 'spaceBreeding' ? '太空育种' : '超级稻计划'}！`, 'success');
            
            // 添加新基因
            if (tech === 'spaceBreeding') {
                gameState.genePool.push(
                    { id: 9, name: '太空诱变株', traits: { yield: 85, drought: 70, disease: 90, pest: 80, quality: 75, mutation: 95 }, rarity: 'legendary' }
                );
                renderGenePool();
            }
        }

        // 显示品种详情
        function showVarietyModal(variety) {
            const modal = document.getElementById('riceModal');
            document.getElementById('modalTitle').textContent = `🌾 ${variety.name}`;
            document.getElementById('modalContent').innerHTML = `
                <div class="rice-card">
                    <div style="margin-bottom: 15px; color: #a8d8ea;">
                        亲本: ${variety.parents.join(' × ')} | 培育年份: ${variety.created} | 世代: F${variety.generation}
                    </div>
                    ${Object.entries(variety.traits).map(([trait, value]) => `
                        <div class="trait-bar">
                            <div class="trait-name">${getTraitName(trait)}</div>
                            <div class="trait-progress">
                                <div class="trait-fill" style="width: ${value}%"></div>
                            </div>
                            <div class="trait-value">${value}</div>
                        </div>
                    `).join('')}
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button onclick="closeModal(); plantImmediately(${variety.id})" class="hybrid-btn">
                        立即种植到试验田
                    </button>
                </div>
            `;
            modal.classList.add('active');
        }

        function getTraitName(trait) {
            const map = {
                yield: '产量潜力', drought: '抗旱性', disease: '抗病性', 
                pest: '抗虫性', quality: '米质品质', flood: '耐涝性',
                salt: '耐盐碱性', aroma: '香气', height: '植株高度',
                mutation: '突变率'
            };
            return map[trait] || trait;
        }

        function plantImmediately(varietyId) {
            const variety = gameState.varieties.find(v => v.id === varietyId);
            const emptyIdx = gameState.fieldPlots.findIndex(p => p === null);
            if (emptyIdx === -1) {
                showNotification('试验田已满！', 'warning');
                return;
            }
            gameState.fieldPlots[emptyIdx] = {
                variety: variety,
                planted: gameState.year,
                mature: true
            };
            renderField();
            showNotification('已种植到试验田', 'success');
        }

        function closeModal() {
            document.getElementById('riceModal').classList.remove('active');
        }

        // 更新统计
        function updateStats() {
            document.getElementById('researchPoints').textContent = gameState.researchPoints;
            document.getElementById('riceVarieties').textContent = gameState.varieties.length;
            document.getElementById('savedPopulation').textContent = gameState.savedPopulation;
            const coverage = Math.floor((gameState.regions.filter(r => r.solved).length / gameState.regions.length) * 100);
            document.getElementById('globalCoverage').textContent = coverage + '%';
        }

        // 时间推进
        function startTimeProgression() {
            setInterval(() => {
                gameState.year++;
                document.getElementById('yearDisplay').textContent = gameState.year;
                
                // 年份进度环
                const progress = ((gameState.year - 1970) % 50) / 50;
                const offset = 251.2 - (251.2 * progress);
                document.getElementById('yearProgress').style.strokeDashoffset = offset;
                
                // 随机事件
                if (Math.random() > 0.8) {
                    triggerRandomEvent();
                }
                
                // 自动获得基础研究点
                if (gameState.year % 5 === 0) {
                    gameState.researchPoints += 10;
                    updateStats();
                }
            }, 10000); // 每10秒一年
        }

        function triggerRandomEvent() {
            const events = [
                { text: '🌊 东南亚发生洪灾，急需耐涝品种！', type: 'warning' },
                { text: '🔬 实验室设备升级，研究效率提升！', type: 'success' },
                { text: '📰 你的研究成果登上《自然》杂志封面！', type: 'success' },
                { text: '🐛 发现新型稻瘟病，需加强抗病育种', type: 'warning' },
                { text: '🌍 联合国粮农组织关注你的研究', type: 'info' }
            ];
            const event = events[Math.floor(Math.random() * events.length)];
            showNotification(event.text, event.type);
        }

        // 通知系统
        function showNotification(text, type = 'info') {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.style.borderLeftColor = type === 'success' ? '#00ff88' : type === 'warning' ? '#e74c3c' : '#FFD700';
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        // 粒子效果
        function createParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = '✨';
                particle.style.left = x + Math.random() * 40 - 20 + 'px';
                particle.style.top = y + Math.random() * 40 - 20 + 'px';
                particle.style.animation = `float ${1 + Math.random()}s ease-out`;
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }
        }

        // 检查解锁
        function checkUnlocks() {
            if (gameState.varieties.length === 5) {
                showNotification('🏆 成就解锁：初出茅庐 - 培育5个新品种', 'success');
            }
            if (gameState.varieties.some(v => v.traits.yield > 90)) {
                showNotification('🏆 成就解锁：高产先锋 - 培育产量超90的品种', 'success');
            }
        }

        // 启动游戏
        window.onload = init;
    </script>
</body>
</html>
