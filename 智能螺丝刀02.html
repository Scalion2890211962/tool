<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartScrew Pro - 智能螺丝刀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        
        /* 背景动画 */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }
        
        /* 头部 */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        
        .status-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .battery {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #00ff88;
        }
        
        .battery-icon {
            width: 30px;
            height: 16px;
            border: 2px solid #00ff88;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 2px;
        }
        
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -4px;
            width: 3px;
            height: 8px;
            background: #00ff88;
            border-radius: 0 2px 2px 0;
        }
        
        .battery-level {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border-radius: 1px;
            transition: width 0.3s;
            width: 85%;
        }
        
        .bluetooth-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 212, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .bluetooth-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: scale(1.1);
        }
        
        .bluetooth-btn.connected {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
        }
        
        .bluetooth-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            color: #00d4ff;
        }
        
        .bluetooth-btn.connected .bluetooth-icon {
            color: #00ff88;
        }
        
        /* 主控制区 */
        .main-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* 扭矩仪表盘 */
        .torque-display {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 30px auto;
        }
        
        .gauge-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 180deg, 
                rgba(0, 212, 255, 0.1) 0deg, 
                rgba(0, 212, 255, 0.3) 90deg, 
                rgba(123, 44, 191, 0.3) 180deg);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.2);
        }
        
        .gauge-inner {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 212, 255, 0.3);
        }
        
        .torque-value {
            font-size: 72px;
            font-weight: 200;
            line-height: 1;
            background: linear-gradient(180deg, #fff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
        }
        
        .torque-unit {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }
        
        .torque-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .gauge-needle {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 100px;
            background: linear-gradient(to top, #00d4ff, #7b2cbf);
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg);
            border-radius: 2px;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }
        
        .gauge-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #00d4ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }
        
        /* 控制按钮 */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        
        .control-btn {
            padding: 25px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .control-btn:hover::before {
            left: 100%;
        }
        
        .btn-cw {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
        
        .btn-ccw {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: #fff;
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.3);
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .control-btn.active {
            animation: rotate 0.5s linear infinite;
            box-shadow: 0 0 30px currentColor;
        }
        
        @keyframes rotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .btn-icon {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }
        
        /* 参数设置 */
        .settings {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .setting-item {
            margin-bottom: 25px;
        }
        
        .setting-item:last-child {
            margin-bottom: 0;
        }
        
        .setting-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .setting-value {
            color: #00d4ff;
            font-weight: 600;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            transition: transform 0.2s;
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* 模式选择 */
        .modes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }
        
        .mode-btn.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        
        /* 数据统计 */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #00d4ff;
            font-variant-numeric: tabular-nums;
        }
        
        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }
        
        /* 日志 */
        .log-container {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #00d4ff;
            margin-right: 10px;
        }
        
        /* 提示框 */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* 螺丝刀可视化 */
        .screwdriver-visual {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 60px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
        
        .screwdriver-visual.active {
            opacity: 1;
        }
        
        .sd-body {
            position: absolute;
            width: 120px;
            height: 40px;
            background: linear-gradient(180deg, #2a2a4a, #1a1a2e);
            border-radius: 10px;
            top: 10px;
            left: 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 212, 255, 0.3);
        }
        
        .sd-head {
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border-radius: 50%;
            top: 10px;
            left: 0;
            animation: spin 0.5s linear infinite;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        
        .sd-bit {
            position: absolute;
            width: 60px;
            height: 8px;
            background: linear-gradient(90deg, #silver, #666);
            top: 26px;
            right: 0;
            border-radius: 0 4px 4px 0;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 响应式 */
        @media (max-width: 480px) {
            .torque-display {
                width: 240px;
                height: 240px;
            }
            .torque-value {
                font-size: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="header">
        <div class="logo">SmartScrew Pro</div>
        <div class="status-bar">
            <div class="battery">
                <span id="batteryText">85%</span>
                <div class="battery-icon">
                    <div class="battery-level" id="batteryLevel"></div>
                </div>
            </div>
            <button class="bluetooth-btn" id="bluetoothBtn" onclick="toggleBluetooth()">
                <svg class="bluetooth-icon" viewBox="0 0 24 24">
                    <path d="M17.71,7.71L12,2h-1v7.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L11,14.41V22h1l5.71-5.71L13.41,12L17.71,7.71z M13,5.83 l1.88,1.88L13,9.59V5.83z M13,18.17v-3.76l1.88,1.88L13,18.17z"/>
                </svg>
            </button>
        </div>
    </div>
    
    <div class="main-container">
        <!-- 扭矩仪表盘 -->
        <div class="torque-display">
            <div class="gauge-bg"></div>
            <div class="gauge-inner">
                <div class="torque-value" id="torqueValue">0.0</div>
                <div class="torque-unit">N·m</div>
                <div class="torque-label">实时扭矩</div>
            </div>
            <div class="gauge-needle" id="gaugeNeedle"></div>
            <div class="gauge-center"></div>
        </div>
        
        <!-- 螺丝刀动画 -->
        <div class="screwdriver-visual" id="sdVisual">
            <div class="sd-head"></div>
            <div class="sd-body"></div>
            <div class="sd-bit"></div>
        </div>
        
        <!-- 主控制按钮 -->
        <div class="controls">
            <button class="control-btn btn-cw" id="btnCW" onmousedown="startDrive('cw')" onmouseup="stopDrive()" ontouchstart="startDrive('cw')" ontouchend="stopDrive()">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
                <span>正转拧紧</span>
            </button>
            <button class="control-btn btn-ccw" id="btnCCW" onmousedown="startDrive('ccw')" onmouseup="stopDrive()" ontouchstart="startDrive('ccw')" ontouchend="stopDrive()">
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
                <span>反转松开</span>
            </button>
        </div>
        
        <!-- 设置面板 -->
        <div class="settings">
            <div class="setting-item">
                <div class="setting-label">
                    <span>扭矩限制</span>
                    <span class="setting-value" id="torqueLimitVal">5.0 N·m</span>
                </div>
                <input type="range" class="slider" id="torqueSlider" min="0.1" max="10.0" step="0.1" value="5.0" oninput="updateTorqueLimit(this.value)">
            </div>
            
            <div class="setting-item">
                <div class="setting-label">
                    <span>转速控制</span>
                    <span class="setting-value" id="speedVal">1500 RPM</span>
                </div>
                <input type="range" class="slider" id="speedSlider" min="0" max="3000" step="100" value="1500" oninput="updateSpeed(this.value)">
            </div>
            
            <div class="modes">
                <button class="mode-btn active" onclick="setMode(this, 'manual')">手动</button>
                <button class="mode-btn" onclick="setMode(this, 'pulse')">脉冲</button>
                <button class="mode-btn" onclick="setMode(this, 'smart')">智能</button>
                <button class="mode-btn" onclick="setMode(this, 'expert')">专家</button>
            </div>
        </div>
        
        <!-- 统计数据 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalScrews">128</div>
                <div class="stat-label">总螺丝数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="workTime">45</div>
                <div class="stat-label">工作分钟</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="efficiency">98%</div>
                <div class="stat-label">合格率</div>
            </div>
        </div>
        
        <!-- 系统日志 -->
        <div class="log-container" id="logContainer">
            <div class="log-entry"><span class="log-time">[系统]</span>智能螺丝刀已就绪，等待蓝牙连接...</div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // 全局状态
        let isConnected = false;
        let isDriving = false;
        let driveDirection = null;
        let currentTorque = 0;
        let targetTorque = 5.0;
        let currentSpeed = 1500;
        let driveMode = 'manual';
        let bluetoothDevice = null;
        let batteryLevel = 85;
        let totalScrews = 128;
        let workTime = 45;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateGauge(0);
            simulateBatteryDrain();
            simulateWorkTime();
            addLog('系统初始化完成，固件版本 v2.1.0');
        });
        
        // 蓝牙连接
        async function toggleBluetooth() {
            const btn = document.getElementById('bluetoothBtn');
            
            if (isConnected) {
                // 断开连接
                if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                    bluetoothDevice.gatt.disconnect();
                }
                isConnected = false;
                btn.classList.remove('connected');
                addLog('蓝牙设备已断开');
                showToast('已断开连接');
                return;
            }
            
            // 尝试连接
            try {
                showToast('正在搜索设备...');
                
                // 检查是否支持 Web Bluetooth
                if (!navigator.bluetooth) {
                    // 模拟连接用于演示
                    setTimeout(() => {
                        isConnected = true;
                        btn.classList.add('connected');
                        addLog('蓝牙已连接: SmartScrew-Pro-X1');
                        showToast('连接成功 (模拟模式)');
                        simulateDataStream();
                    }, 1500);
                    return;
                }
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['battery_service', 'device_information'] }],
                    optionalServices: ['generic_access']
                });
                
                const server = await bluetoothDevice.gatt.connect();
                isConnected = true;
                btn.classList.add('connected');
                addLog(`蓝牙已连接: ${bluetoothDevice.name || '未知设备'}`);
                showToast('连接成功');
                
                // 监听断开
                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    isConnected = false;
                    btn.classList.remove('connected');
                    addLog('蓝牙连接意外断开');
                });
                
                simulateDataStream();
                
            } catch (error) {
                console.error('蓝牙连接失败:', error);
                showToast('连接失败: ' + error.message);
                addLog('蓝牙连接失败: ' + error.message);
            }
        }
        
        // 开始驱动
        function startDrive(direction) {
            if (!isConnected) {
                showToast('请先连接蓝牙设备');
                return;
            }
            
            if (isDriving) return;
            
            isDriving = true;
            driveDirection = direction;
            
            const btn = direction === 'cw' ? document.getElementById('btnCW') : document.getElementById('btnCCW');
            btn.classList.add('active');
            
            document.getElementById('sdVisual').classList.add('active');
            
            addLog(`${direction === 'cw' ? '正转' : '反转'}启动 | 扭矩限制: ${targetTorque}N·m | 转速: ${currentSpeed}RPM`);
            
            // 模拟扭矩增加
            simulateTorque();
        }
        
        // 停止驱动
        function stopDrive() {
            if (!isDriving) return;
            
            isDriving = false;
            document.getElementById('btnCW').classList.remove('active');
            document.getElementById('btnCCW').classList.remove('active');
            document.getElementById('sdVisual').classList.remove('active');
            
            // 扭矩归零动画
            const decay = setInterval(() => {
                currentTorque *= 0.8;
                if (currentTorque < 0.1) {
                    currentTorque = 0;
                    clearInterval(decay);
                }
                updateGauge(currentTorque);
            }, 50);
            
            addLog(`驱动停止 | 峰值扭矩: ${currentTorque.toFixed(2)}N·m`);
            
            // 更新统计数据
            if (driveDirection === 'cw' && Math.random() > 0.3) {
                totalScrews++;
                document.getElementById('totalScrews').textContent = totalScrews;
            }
        }
        
        // 模拟扭矩变化
        function simulateTorque() {
            if (!isDriving) return;
            
            const increment = (Math.random() * 0.5 + 0.2) * (currentSpeed / 1500);
            currentTorque += increment;
            
            // 检查扭矩限制
            if (currentTorque >= targetTorque) {
                currentTorque = targetTorque;
                if (driveMode === 'smart') {
                    stopDrive();
                    showToast('已达到设定扭矩，自动停止');
                    addLog('智能保护：已达到扭矩限制，自动停止');
                }
            }
            
            updateGauge(currentTorque);
            
            // 模拟数据发送到蓝牙
            if (isConnected && Math.random() > 0.7) {
                addLog(`[BT] 扭矩:${currentTorque.toFixed(2)}N·m 转速:${currentSpeed}RPM 电量:${batteryLevel}%`);
            }
            
            setTimeout(() => simulateTorque(), 100);
        }
        
        // 更新仪表盘
        function updateGauge(torque) {
            const maxTorque = 10.0;
            const percentage = Math.min(torque / maxTorque, 1);
            const angle = -90 + (percentage * 180);
            
            document.getElementById('gaugeNeedle').style.transform = `translateX(-50%) rotate(${angle}deg)`;
            document.getElementById('torqueValue').textContent = torque.toFixed(1);
            
            // 颜色警告
            const valueEl = document.getElementById('torqueValue');
            if (percentage > 0.9) {
                valueEl.style.background = 'linear-gradient(180deg, #ff4444, #ff8844)';
                valueEl.style.webkitBackgroundClip = 'text';
            } else if (percentage > 0.7) {
                valueEl.style.background = 'linear-gradient(180deg, #ffaa00, #ffdd44)';
                valueEl.style.webkitBackgroundClip = 'text';
            } else {
                valueEl.style.background = 'linear-gradient(180deg, #fff, #00d4ff)';
                valueEl.style.webkitBackgroundClip = 'text';
            }
        }
        
        // 更新扭矩限制
        function updateTorqueLimit(val) {
            targetTorque = parseFloat(val);
            document.getElementById('torqueLimitVal').textContent = val + ' N·m';
        }
        
        // 更新速度
        function updateSpeed(val) {
            currentSpeed = parseInt(val);
            document.getElementById('speedVal').textContent = val + ' RPM';
        }
        
        // 设置模式
        function setMode(btn, mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            driveMode = mode;
            
            const modeNames = {
                'manual': '手动模式：自由控制',
                'pulse': '脉冲模式：间歇扭矩',
                'smart': '智能模式：自动停止',
                'expert': '专家模式：无限制'
            };
            
            addLog(`切换至${modeNames[mode]}`);
            showToast(modeNames[mode]);
        }
        
        // 模拟电池消耗
        function simulateBatteryDrain() {
            setInterval(() => {
                if (isDriving && batteryLevel > 0) {
                    batteryLevel -= 0.1;
                    updateBattery();
                }
            }, 10000);
        }
        
        function updateBattery() {
            batteryLevel = Math.max(0, Math.min(100, batteryLevel));
            document.getElementById('batteryText').textContent = Math.floor(batteryLevel) + '%';
            document.getElementById('batteryLevel').style.width = batteryLevel + '%';
            
            if (batteryLevel < 20) {
                document.getElementById('batteryLevel').style.background = 'linear-gradient(90deg, #ff4444, #ff8844)';
            }
        }
        
        // 模拟工作时间
        function simulateWorkTime() {
            setInterval(() => {
                if (isDriving) {
                    workTime++;
                    document.getElementById('workTime').textContent = workTime;
                }
            }, 60000);
        }
        
        // 模拟数据流
        function simulateDataStream() {
            if (!isConnected) return;
            
            // 随机温度、振动数据
            if (Math.random() > 0.8) {
                const temp = (35 + Math.random() * 15).toFixed(1);
                const vibration = (Math.random() * 2).toFixed(2);
                addLog(`[传感器] 温度:${temp}°C 振动:${vibration}g`);
            }
            
            setTimeout(() => simulateDataStream(), 3000);
        }
        
        // 添加日志
        function addLog(message) {
            const container = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span>${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // 限制日志数量
            while (container.children.length > 20) {
                container.removeChild(container.firstChild);
            }
        }
        
        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // 防止页面滚动
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.control-btn')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
